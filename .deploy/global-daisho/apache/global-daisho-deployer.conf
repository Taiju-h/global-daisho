Alias "/__deploy/" "/var/www/global-daisho-deployer/"

<Directory "/var/www/global-daisho-deployer/">
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.php

    AuthType Basic
    AuthName "GLOBAL DAISHO Deploy"
    AuthUserFile /etc/apache2/global-daisho-deployer.htpasswd

    Require valid-user

</Directory>

# Protect the entire salesdata area with the same credentials as /__deploy/.
<Directory "/var/www/daisho/salesdata/">
    Options -Indexes
    AllowOverride None

    AuthType Basic
    AuthName "GLOBAL DAISHO Sales"
    AuthUserFile /etc/apache2/global-daisho-deployer.htpasswd

    Require valid-user
</Directory>

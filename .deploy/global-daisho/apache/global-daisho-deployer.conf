Alias "/__deploy/" "/var/www/global-daisho-deployer/"

<Directory "/var/www/global-daisho-deployer/">
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.php

    AuthType Basic
    AuthName "GLOBAL DAISHO Deploy"
    AuthUserFile /etc/apache2/global-daisho-deployer.htpasswd

    Require valid-user

</Directory>

# Protect every SDS index and document with the same credentials as /__deploy/.
<Directory "/var/www/daisho/salesdata/sds/">
    Options -Indexes
    AllowOverride None

    AuthType Basic
    AuthName "GLOBAL DAISHO Deploy"
    AuthUserFile /etc/apache2/global-daisho-deployer.htpasswd

    Require valid-user
</Directory>


# Protect the internal sales CRM with Apache Basic Auth as a second barrier.
# The application still keeps its own user login; this blocks unauthenticated HTTP access first.
<Directory "/var/www/daisho/salesdata/crm/">
    Options -Indexes
    AllowOverride None

    AuthType Basic
    AuthName "GLOBAL DAISHO Sales"
    AuthUserFile /etc/apache2/global-daisho-deployer.htpasswd

    Require valid-user
</Directory>
